name: Sonde backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Sonde des matchs terminés
        run: node probe.mjs
      - name: Publier l'échantillon
        run: |
          git config user.name "parisanalyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Sonde backtest" && git push
