name: Collecte des cotes

on:
  schedule:
    - cron: '7,27,47 * * * *' # trois essais par heure : GitHub saute souvent des lancements
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lancer les mesures du lundi (étape en bas)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Collecte Polymarket + Kalshi
        run: node collect.mjs
      - name: Publier les données
        run: |
          git config user.name "parisanalyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached -r samples 2>/dev/null || true
          rm -rf samples
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          if [ "$(date -u +%H)" = "03" ]; then
            # Une fois par jour, on repart d'un seul commit : le dépôt ne grossit pas avec les relevés horaires.
            git checkout -q --orphan compact
            git commit -q -m "Données du $(date -u +%F) (historique git compacté)"
            git push -f origin compact:main
          else
            git commit -q -m "Mise à jour des cotes" && git push
          fi
      - name: Mesures du lundi (le planificateur GitHub démarre trop rarement, on les lance d'ici)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          lance() {
            deja=$(gh run list --workflow "$1" --created ">=$(date -u +%F)" --json databaseId --jq length || echo 1)
            if [ "$deja" = "0" ]; then gh workflow run "$1" --ref main && echo "$1 lancé"; else echo "$1 déjà lancé aujourd'hui"; fi
          }
          case "$(date -u +%u%H)" in
            104) lance backtest.yml ;;
            106) lance extras.yml ;;
            *) echo "Pas de mesure à lancer" ;;
          esac
