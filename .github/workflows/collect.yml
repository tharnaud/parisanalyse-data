name: Collecte des cotes

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Collecte Polymarket + Kalshi
        run: node collect.mjs
      - name: Publier les données
        run: |
          git config user.name "parisanalyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached -r samples 2>/dev/null || true
          rm -rf samples
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          if [ "$(date -u +%H)" = "03" ]; then
            # Une fois par jour, on repart d'un seul commit : le dépôt ne grossit pas avec les relevés horaires.
            git checkout -q --orphan compact
            git commit -q -m "Données du $(date -u +%F) (historique git compacté)"
            git push -f origin compact:main
          else
            git commit -q -m "Mise à jour des cotes" && git push
          fi
