name: Backtest

on:
  schedule:
    - cron: '41 4 * * 1' # chaque lundi : nouvelle mesure sur les 35 derniers jours
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours de matchs à reprendre"
        default: "35"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Reconstituer les matchs joués
        env:
          BT_DAYS: ${{ github.event.inputs.days || '35' }}
        run: node backtest.mjs
      - name: Publier les résultats
        run: |
          git config user.name "parisanalyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Backtest" && git pull -q --rebase && git push
