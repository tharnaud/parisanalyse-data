name: Données complémentaires

on:
  schedule:
    - cron: '23 6 * * 1' # chaque lundi, après la mesure
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours à reprendre"
        default: "40"

permissions:
  contents: write

concurrency:
  group: extras
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Cotes de clôture et notes Elo
        env:
          BT_DAYS: ${{ github.event.inputs.days || '40' }}
        run: node extras.mjs
      - name: Publier
        run: |
          git config user.name "parisanalyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/extra
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Données complémentaires" && git pull -q --rebase && git push
